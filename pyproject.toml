[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lensify"
version = "0.15.0"
description = "One-page adaptive project lens + token-optimized context capsule for AI agents"
authors = [{name = "Sachin Patil", email = "agenticailab01@gmail.com"}]
license = {text = "MIT"}
requires-python = ">=3.9"
readme = "README.md"
keywords = ["context-engineering", "token-optimization", "project-understanding", "claude-code"]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
lensify = "scripts.scan:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers --ignore=tests/fixtures"
norecursedirs = ["tests/fixtures", "*.egg", ".git"]

[tool.setuptools]
packages = ["scripts", "mcp_server"]
package-dir = {"scripts" = "skills/lensify/scripts"}
