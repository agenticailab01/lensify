name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: tests + perf
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Run unit tests
        run: python -m pytest tests/ -q --ignore=tests/benchmark_perf.py

      - name: Run perf + security budgets
        run: python -m pytest tests/benchmark_perf.py -v

      - name: Smoke-test scan engine
        run: python skills/projectlens/scripts/scan.py . --no-git --output /tmp/lens-out
        shell: bash

      - name: Smoke-test MCP server
        if: runner.os != 'Windows'
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            | python -m mcp_server
        shell: bash

  static-analysis:
    name: security + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for forbidden patterns
        run: |
          # The actual static-analysis tests in benchmark_perf.py enforce this.
          # This step makes the check visible in CI status separately.
          pip install pytest
          python -m pytest tests/benchmark_perf.py::test_no_forbidden_security_patterns -v
          python -m pytest tests/benchmark_perf.py::test_outbound_network_only_anthropic_api -v
          python -m pytest tests/benchmark_perf.py::test_user_adapter_loader_is_opt_in -v
          python -m pytest tests/benchmark_perf.py::test_hook_never_imports_frameworks -v
          python -m pytest tests/benchmark_perf.py::test_adapter_detect_never_opens_files -v
